<!doctype html><html lang="en"><meta charset="utf-8"><title>Foothold Exchange · Phone viewport QA</title><style>body{margin:0;background:#e9e4f0;font:14px 'Segoe UI',sans-serif;color:#36214e;padding:24px}h1{font-size:20px;margin:0 0 8px}p{margin:0 0 16px}iframe{width:844px;height:390px;border:8px solid #30233e;border-radius:20px;display:block;margin:0 0 20px;box-shadow:0 12px 30px #38204f22}button{padding:8px 14px;margin:0 6px 12px 0;border:1px solid #9677ab;border-radius:6px;background:white;color:#452e59;cursor:pointer}body{padding:12px}h1{font-size:17px}p{font-size:12px;margin-bottom:8px}iframe{margin-bottom:10px}pre{max-height:90px;overflow:auto;font-size:11px;margin:6px 0}</style><h1>Landscape-phone viewport check</h1><p>Real embedded viewport. The app’s phone media queries run inside this frame.</p><button onclick="document.querySelector('iframe').style.width='844px';document.querySelector('iframe').style.height='390px'">844 × 390</button><button onclick="document.querySelector('iframe').style.width='667px';document.querySelector('iframe').style.height='375px'">667 × 375</button><iframe src="index.html" title="Landscape phone concept"></iframe><button onclick="audit()">Check layout</button><pre id="audit"></pre><script>function audit(){const f=document.querySelector("iframe"),d=f.contentDocument,w=f.contentWindow;const c=d.getElementById("catalogue"),s=d.getElementById("shop"),r=s.getBoundingClientRect();document.getElementById("audit").textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],pageHorizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,catalogueHorizontalOverflow:c.scrollWidth>c.clientWidth,catalogueScrollable:c.scrollHeight>c.clientHeight,shopWithinViewport:r.left>=0&&r.right<=w.innerWidth&&r.top>=0&&r.bottom<=w.innerHeight,dialogHorizontalOverflow:d.getElementById("purchase").scrollWidth>d.getElementById("purchase").clientWidth,visibleWorldControlOverlaps:(()=>{if(!s.hidden)return [];const a=[...d.querySelectorAll("#world button")].filter(x=>x.getClientRects().length);return a.flatMap((x,i)=>a.slice(i+1).filter(y=>{const r=x.getBoundingClientRect(),t=y.getBoundingClientRect();return Math.min(r.right,t.right)-Math.max(r.left,t.left)>2&&Math.min(r.bottom,t.bottom)-Math.max(r.top,t.top)>2}).map(y=>[x.textContent.trim(),y.textContent.trim()]))})()},null,2)}document.querySelector("iframe").addEventListener("load",audit);</script></html>
